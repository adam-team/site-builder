<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дизайн-тека: выбор дизайна сайта</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0f0f10;--bg2:#1b1b1d;--bg3:#272729;--text:#f1f1f1;--muted:#aaaaaa;--line:#2e2e31;--red:#ff3b45;--ok:#2fd18b;color-scheme:dark}
:root[data-theme=light]{--bg:#ffffff;--bg2:#f2f2f2;--bg3:#e5e5e5;--text:#0f0f0f;--muted:#606060;--line:#e3e3e3;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap;text-decoration:none}
.brand .play{width:32px;height:22px;border-radius:7px;background:var(--red);display:grid;place-items:center}
.brand .play::after{content:"";border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.search{flex:1;max-width:620px;margin:0 auto;display:flex}
.search input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-right:0;border-radius:40px 0 0 40px;padding:10px 18px;color:var(--text);font:inherit;font-size:15px}
.search span{border:1px solid var(--line);background:var(--bg2);border-radius:0 40px 40px 0;padding:0 18px;display:grid;place-items:center;color:var(--muted)}
.icon-btn{background:var(--bg2);border:0;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.chips{display:flex;gap:10px;padding:12px 20px;overflow-x:auto;scrollbar-width:none;position:sticky;top:61px;z-index:19;background:var(--bg)}
.chip{white-space:nowrap;background:var(--bg2);border:0;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}
.chip.on{background:var(--text);color:var(--bg)}
.intro{padding:6px 20px 0;color:var(--muted);font-size:14px;max-width:1100px}
.intro b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:36px 16px;padding:18px 20px 120px}
.card{cursor:pointer;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3)}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.thumb video{opacity:0;transition:opacity .25s}
.card:hover .thumb video.ready{opacity:1}
.card:hover .thumb{border-radius:0;transition:border-radius .2s .3s}
.badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px}
.num{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:6px}
.picked .num{background:var(--ok)}
.nothumb{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.meta{display:flex;gap:12px;margin-top:12px}
.ava{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.meta h3{margin:0 0 4px;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}

/* страница просмотра */
.watch{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none}
.watch.open{display:block}
.watch .top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.wlay{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;padding:20px 20px 120px;max-width:1720px;margin:0 auto}
@media (max-width:1000px){.wlay{grid-template-columns:1fr}}
.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player video,.player img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.wtitle{font-size:22px;font-weight:800;margin:14px 0 10px;line-height:1.3}
.wbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.chan{display:flex;align-items:center;gap:12px}
.chan b{display:block}
.chan small{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{border:0;border-radius:40px;padding:10px 18px;font-weight:700;font-size:14px;background:var(--bg2);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.act.main{background:var(--text);color:var(--bg)}
.act.main.done{background:var(--ok);color:#06210f}
.desc{background:var(--bg2);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14.5px;line-height:1.6}
.desc .row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;color:var(--muted)}
.sw{display:inline-flex;gap:4px;vertical-align:middle}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.side h4{margin:0 0 12px;font-size:16px}
.mini{display:flex;gap:10px;margin-bottom:12px;cursor:pointer}
.mini .thumb{width:168px;flex:none;border-radius:8px}
.mini h5{margin:0 0 4px;font-size:14px;line-height:1.3}
.mini p{margin:0;font-size:12.5px;color:var(--muted)}

/* мой выбор */
.tray{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);z-index:50;background:var(--text);color:var(--bg);border-radius:16px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6);transition:transform .35s;max-width:calc(100% - 32px)}
.tray.show{transform:translateX(-50%)}
.tray .list{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:var(--red);color:#fff;white-space:nowrap}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:800;padding:10px 18px;border-radius:10px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){header{gap:10px;padding:10px 12px}.brand span{display:none}.chips{top:61px;padding:10px 12px}.grid{padding:14px 12px 120px;grid-template-columns:1fr}.wlay{padding:12px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#" onclick="closeWatch();return false"><i class="play"></i><span>Дизайн-тека</span></a>
  <label class="search"><input id="q" placeholder="Поиск: тёмный, кафе, премиум, BOSS VISION, №12…" autocomplete="off"><span>⌕</span></label>
  <button class="icon-btn" id="theme" title="Светлая или тёмная тема">◐</button>
</header>
<div class="chips" id="chips"></div>
<p class="intro">Наведи на обложку, чтобы посмотреть превью. Нажми, чтобы открыть видео, живой сайт и <b>выбрать дизайн</b>. Можно выбрать до трёх, потом нажми «Скопировать для агента» и отправь в чат.</p>
<main class="grid" id="grid"></main>

<section class="watch" id="watch">
  <div class="top"><button class="icon-btn" onclick="closeWatch()" title="Назад">←</button><a class="brand" href="#" onclick="closeWatch();return false"><i class="play"></i><span>Дизайн-тека</span></a></div>
  <div class="wlay">
    <div>
      <div class="player" id="player"></div>
      <div class="wtitle" id="wtitle"></div>
      <div class="wbar">
        <div class="chan" id="chan"></div>
        <div class="acts" id="acts"></div>
      </div>
      <div class="desc" id="desc"></div>
    </div>
    <aside class="side"><h4>Похожие дизайны</h4><div id="similar"></div></aside>
  </div>
</section>

<div class="tray" id="tray"><span class="list" id="trayList"></span><button onclick="copyPick()">Скопировать для агента</button></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
var D = window.DESIGNS || [];
var CH = [["all","Все"],["own","Мои дизайны"],["platform","Дизайны платформ"],["trend","Тренды 2026"],["github","GitHub-шаблоны"],["dark","Тёмные"],["light","Светлые"],["picked","Мой выбор"]];
var state = {chip:"all", q:""};
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null } }
var picks = store("sb-picks") || [];
var theme = store("sb-theme"); if(theme) document.documentElement.dataset.theme = theme;
document.getElementById("theme").onclick = function(){ var t = document.documentElement.dataset.theme==="light"?"dark":"light"; document.documentElement.dataset.theme=t; store("sb-theme",t) };

var AVA = {own:"#ff3b45", platform:"#7c5cff", trend:"#ff8a00", github:"#2d7ff9"};
function esc(s){ return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }
function dur(s){ s=s||0; return Math.floor(s/60)+":"+String(s%60).padStart(2,"0") }
function chan(d){ return d.group==="github" ? d.author+" · GitHub" : d.author==="Куралай" ? "Куралай · "+d.groupName : d.author }
function sub(d){ return [d.niche, d.dark?"тёмный":"светлый"].filter(Boolean).join(" · ") }

function thumbHTML(d, withVideo){
  var inner = d.thumb ? '<img loading="lazy" src="'+d.thumb+'" alt="">' + (withVideo && d.video ? '<video muted loop playsinline preload="none" data-src="'+d.video+'"></video>' : "")
                      : '<div class="nothumb">превью ещё не записано<br>tools/record-previews.mjs</div>';
  return '<div class="thumb">'+inner+'<span class="num">№'+d.n+'</span>'+(d.dur?'<span class="badge">'+dur(d.dur)+'</span>':"")+'</div>';
}

function match(d){
  var c = state.chip;
  if(c==="dark" && !d.dark) return false;
  if(c==="light" && d.dark) return false;
  if(c==="picked" && picks.indexOf(d.n)<0) return false;
  if(["own","platform","trend","github"].indexOf(c)>=0 && d.group!==c) return false;
  var q = state.q.trim().toLowerCase().replace("№","");
  if(!q) return true;
  if(/^\d+$/.test(q)) return String(d.n)===q;
  return (d.name+" "+d.mood+" "+d.niche+" "+d.author+" "+d.groupName+" "+(d.dark?"тёмный":"светлый")).toLowerCase().indexOf(q)>=0;
}

function renderChips(){
  document.getElementById("chips").innerHTML = CH.map(function(c){ return '<button class="chip'+(state.chip===c[0]?" on":"")+'" data-c="'+c[0]+'">'+c[1]+(c[0]==="picked"&&picks.length?" ("+picks.length+")":"")+'</button>' }).join("");
}
document.getElementById("chips").onclick = function(e){ var b=e.target.closest(".chip"); if(!b) return; state.chip=b.dataset.c; renderChips(); renderGrid() };
document.getElementById("q").oninput = function(e){ state.q=e.target.value; renderGrid() };

function renderGrid(){
  var list = D.filter(match);
  var g = document.getElementById("grid");
  if(!list.length){ g.innerHTML = '<div class="empty">Ничего не нашлось. Попробуй другое слово или вкладку «Все».</div>'; return }
  g.innerHTML = list.map(function(d){
    return '<article class="card'+(picks.indexOf(d.n)>=0?" picked":"")+'" data-n="'+d.n+'">'+thumbHTML(d,true)+
      '<div class="meta"><div class="ava" style="background:'+AVA[d.group]+'">'+esc((d.author||"?")[0].toUpperCase())+'</div>'+
      '<div><h3>'+esc(d.name)+'</h3><p>'+esc(chan(d))+'<br>'+esc(sub(d))+'</p></div></div></article>';
  }).join("");
}
var grid = document.getElementById("grid");
grid.addEventListener("mouseover", function(e){
  var c = e.target.closest(".card"); if(!c) return;
  var v = c.querySelector("video"); if(!v || v.dataset.on) return;
  v.dataset.on = 1; if(!v.src) v.src = v.dataset.src;
  v.oncanplay = function(){ v.classList.add("ready") };
  v.currentTime = 0; v.play().catch(function(){});
});
grid.addEventListener("mouseout", function(e){
  var c = e.target.closest(".card"); if(!c || c.contains(e.relatedTarget)) return;
  var v = c.querySelector("video"); if(v){ v.pause(); delete v.dataset.on; v.classList.remove("ready") }
});
grid.addEventListener("click", function(e){ var c=e.target.closest(".card"); if(c) location.hash = c.dataset.n });

function openWatch(n){
  var d = D.find(function(x){ return x.n===n }); if(!d) return;
  document.getElementById("player").innerHTML = d.video ? '<video src="'+d.video+'" poster="'+d.thumb+'" controls autoplay muted loop playsinline></video>'
    : (d.thumb ? '<img src="'+d.thumb+'">' : '<div class="nothumb">превью ещё не записано</div>');
  document.getElementById("wtitle").textContent = "№"+d.n+" · "+d.name;
  document.getElementById("chan").innerHTML = '<div class="ava" style="background:'+AVA[d.group]+'">'+esc((d.author||"?")[0].toUpperCase())+'</div><div><b>'+esc(chan(d))+'</b><small>'+esc(d.groupName)+'</small></div>';
  var on = picks.indexOf(d.n)>=0;
  document.getElementById("acts").innerHTML =
    '<button class="act main'+(on?" done":"")+'" id="pickBtn">'+(on?"✓ Выбран":"Выбрать этот дизайн")+'</button>'+
    (d.live?'<a class="act" href="'+esc(d.live)+'" target="_blank" rel="noopener">Открыть живой сайт ↗</a>':"")+
    (d.repo?'<a class="act" href="'+esc(d.repo)+'" target="_blank" rel="noopener">Код на GitHub ↗</a>':"");
  document.getElementById("pickBtn").onclick = function(){ togglePick(d.n); openWatch(d.n) };
  var kind = {tokens:"Палитра для шаблона сайта: агент соберёт сайт со своими цветами, шрифтами и анимациями", own:"Готовый дизайн Куралай: агент возьмёт его за основу и поменяет под вас", external:"Готовый шаблон с GitHub: агент скопирует код и поменяет под вас", fetch:"Шаблон с GitHub: агент скачает его по команде, код в репозитории не хранится"}[d.kind];
  document.getElementById("desc").innerHTML = '<b>'+esc(d.mood||d.name)+'</b><br>'+esc(kind)+
    '<div class="row"><span>Подходит: '+esc(d.niche||"любая тема")+'</span><span>'+(d.dark?"Тёмный":"Светлый")+'</span>'+
    (d.colors.length?'<span>Цвета: <span class="sw">'+d.colors.map(function(c){return '<i style="background:'+c+'" title="'+c+'"></i>'}).join("")+'</span></span>':"")+
    (d.fonts.length?'<span>Шрифты: '+esc(d.fonts[0])+(d.fonts[1]!==d.fonts[0]?" + "+esc(d.fonts[1]):"")+'</span>':"")+
    (d.license?'<span>Лицензия: '+esc(d.license)+'</span>':"")+'</div>';
  var sim = D.filter(function(x){ return x.n!==d.n && x.group===d.group }).concat(D.filter(function(x){ return x.group!==d.group && x.dark===d.dark })).slice(0,12);
  document.getElementById("similar").innerHTML = sim.map(function(x){
    return '<div class="mini" data-n="'+x.n+'">'+thumbHTML(x,false)+'<div><h5>'+esc(x.name)+'</h5><p>'+esc(chan(x))+'<br>'+esc(sub(x))+'</p></div></div>' }).join("");
  document.getElementById("watch").classList.add("open");
  document.getElementById("watch").scrollTop = 0;
  document.body.style.overflow = "hidden";
}
document.getElementById("similar").onclick = function(e){ var m=e.target.closest(".mini"); if(m) location.hash = m.dataset.n };
function closeWatch(){ if(location.hash) history.pushState("", "", location.pathname); hideWatch() }
function hideWatch(){ document.getElementById("watch").classList.remove("open"); document.getElementById("player").innerHTML=""; document.body.style.overflow="" }
function route(){ var n = parseInt(location.hash.slice(1)); if(n) openWatch(n); else hideWatch() }
window.addEventListener("hashchange", route);
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeWatch() });

function togglePick(n){
  var i = picks.indexOf(n);
  if(i>=0) picks.splice(i,1); else { if(picks.length>=3) picks.shift(); picks.push(n) }
  store("sb-picks", picks); renderChips(); renderGrid(); renderTray();
}
function pickText(){
  return "Мой выбор дизайна: " + picks.map(function(n){ var d=D.find(function(x){return x.n===n}); return "№"+n+" «"+d.name+"»" }).join(", ");
}
function renderTray(){
  document.getElementById("tray").classList.toggle("show", picks.length>0);
  document.getElementById("trayList").textContent = pickText();
}
function toast(t){ var el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); setTimeout(function(){ el.classList.remove("on") },2200) }
function copyPick(){
  var t = pickText();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast("Скопировано. Вставь в чат с агентом") },
    function(){ prompt("Скопируй и отправь агенту:", t) });
}

renderChips(); renderGrid(); renderTray(); route();
</script>
</body>
</html>
