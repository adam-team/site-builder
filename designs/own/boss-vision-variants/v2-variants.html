<html lang="ru">
<head>
<meta charset="utf-8">
<title>BOSS VISION — дизайн v2</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* A3 альбомный, одна страница = один вариант: 5 экранов телефона + письмо */
@page { size: 420mm 236mm; margin: 0 }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact }
html, body { margin: 0; background: #eef0f3; font-family: 'Manrope', system-ui, sans-serif; color: #0f172a }
.page { width: 420mm; height: 236mm; overflow: hidden; position: relative; break-after: page; padding: 13mm 15mm; display: flex; flex-direction: column; gap: 7mm }
.page:last-child { break-after: auto }
svg.lucide { width: 1em; height: 1em; stroke-width: 2.1; vertical-align: -0.14em; flex-shrink: 0 }

/* обложка и вводные страницы */
.cover { background: #0b1220; color: #e8edf7; justify-content: space-between }
.k { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .65; font-weight: 700 }
.h1 { font-size: 82px; line-height: .95; font-weight: 800; letter-spacing: -.035em; margin: 18px 0 0 }
.lead { max-width: 820px; font-size: 19px; line-height: 1.6; opacity: .82 }
.rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10mm }
.row-card { border-radius: 22px; padding: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1) }
.row-card h3 { margin: 10px 0 6px; font-size: 19px }
.row-card p { margin: 0; font-size: 14.5px; line-height: 1.55; opacity: .8 }
.ico { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px }
.chips6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px }
.c6 { border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04) }
.c6 .sw { height: 84px; display: grid; grid-template-columns: 2fr 1fr 1fr }
.c6 b { display: block; padding: 10px 12px 2px; font-size: 14px }
.c6 span { display: block; padding: 0 12px 12px; font-size: 11.5px; opacity: .65 }

/* шапка варианта */
.vhead { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10mm; align-items: start }
.vnum { font-size: 11.5px; letter-spacing: .26em; text-transform: uppercase; opacity: .6; font-weight: 700 }
.vname { font-size: 50px; line-height: 1; margin: 8px 0 10px; letter-spacing: -.03em }
.vtag { font-size: 14.5px; line-height: 1.55; opacity: .85; max-width: 600px; margin: 0 }
.block h4 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; opacity: .6; font-weight: 800 }
.pal { display: flex; gap: 8px; flex-wrap: wrap }
.pal div { width: 66px }
.pal i { display: block; height: 42px; border-radius: 12px; border: 1px solid rgba(128,128,128,.25) }
.pal small { display: block; font-size: 10px; margin-top: 4px; opacity: .75; line-height: 1.3 }
.fonts { display: flex; gap: 22px; align-items: baseline; margin-top: 12px }
.aa { font-size: 38px; line-height: 1 }
.fonts small { display: block; font-size: 10.5px; opacity: .7 }
.why { font-size: 13px; line-height: 1.5; margin: 0; padding-left: 16px }
.why li { margin-bottom: 4px }
.screens { display: grid; grid-template-columns: repeat(5, 1fr) 1.08fr; gap: 6.5mm; flex: 1; min-height: 0; align-items: start }
.cap { text-align: center; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .6; margin-top: 8px }

/* телефон */
.ph { width: 100%; aspect-ratio: 9 / 20.4; border-radius: 40px; padding: 7px; background: #0b0b0c; box-shadow: 0 26px 50px -26px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06) }
.scr { height: 100%; border-radius: 34px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 11px; line-height: 1.35 }
.notch { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 72px; height: 19px; border-radius: 20px; background: #0b0b0c; z-index: 3 }
.st { display: flex; justify-content: space-between; padding: 9px 18px 3px; font-size: 9.5px; font-weight: 700; position: relative; z-index: 2 }
.bd { padding: 6px 12px 8px; display: grid; gap: 8px; grid-auto-rows: max-content; height: calc(100% - 88px); overflow: hidden }
.dsp { font-family: var(--display); font-weight: var(--dw); letter-spacing: var(--dls) }
.mut { color: var(--muted) }
.card { background: var(--card); border-radius: var(--r); padding: 10px; border: var(--cb); box-shadow: var(--sh) }
.hero { background: var(--hero); color: var(--onHero); border-radius: var(--r); padding: 12px; position: relative; overflow: hidden }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: var(--onAccent); border-radius: var(--br); padding: 9px; font-weight: 800; font-size: 11px }
.btn.ghost { background: var(--soft); color: var(--ink) }
.btn.alt { background: var(--accent2); color: var(--onAccent2) }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); font-weight: 800; font-size: 8.5px; margin: 0 3px 3px 0 }
.chip.ok { background: var(--okSoft); color: var(--ok) }
.chip.on { background: var(--accent); color: var(--onAccent) }
.r { display: flex; align-items: center; gap: 8px }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent2); color: var(--onAccent2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 10.5px; flex-shrink: 0 }
.lg { width: 32px; height: 32px; border-radius: 10px; background: var(--hero); color: var(--onHero); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0 }
.fi { width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; background: var(--iconBg); color: var(--iconInk); flex-shrink: 0 }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px }
.bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 3px }
.bar i { display: block; height: 100%; background: var(--accent2) }
.step { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 700 }
.step b { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; background: rgba(255,255,255,.18) }
.step.done b { background: var(--accent2); color: var(--onAccent2) }
.nav { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav); border-top: var(--cb); padding: 7px 0 13px; font-size: 8.5px; font-weight: 700; color: var(--muted); text-align: center }
.nav span { display: flex; flex-direction: column; align-items: center; gap: 3px }
.nav span svg { font-size: 16px }
.nav span.on { color: var(--accent) }
.ft { font-size: 10.5px; font-weight: 800 }
.fd { font-size: 8.8px; color: var(--muted); line-height: 1.3 }

/* письмо */
.mail { width: 100%; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 26px 50px -26px rgba(0,0,0,.45); border: 1px solid rgba(0,0,0,.08); font-family: var(--body) }
.mail .bar0 { display: flex; gap: 5px; padding: 8px 10px; background: #f1f3f6; border-bottom: 1px solid #e3e6ea }
.mail .bar0 i { width: 8px; height: 8px; border-radius: 50%; background: #d4d7dc }
.mail .meta { padding: 9px 12px; font-size: 9.5px; color: #64748b; border-bottom: 1px solid #eef0f3 }
.mail .meta b { color: #0f172a }
.mail .in { background: var(--mailBg); padding: 14px 12px 16px }
.mail .head { background: var(--hero); color: var(--onHero); border-radius: 14px 14px 0 0; padding: 16px; text-align: center }
.mail .body { background: #fff; border-radius: 0 0 14px 14px; padding: 16px 14px; color: #0f172a; font-size: 10.5px; line-height: 1.55 }
.mail .mbtn { display: inline-block; margin-top: 10px; padding: 9px 18px; border-radius: var(--br); background: var(--accent); color: var(--onAccent); font-weight: 800; font-size: 10.5px }
.logo { display: inline-flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 800; letter-spacing: -.01em }
.mark { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent2); color: var(--onAccent2); font-size: 11px; font-weight: 900 }

table.cmp { width: 100%; border-collapse: collapse; font-size: 13.5px }
table.cmp th, table.cmp td { text-align: left; padding: 10px; border-bottom: 1px solid #dfe3e8; vertical-align: top }
table.cmp th { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: #64748b }
.dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #2563eb; margin-right: 3px }
.dots i.o { background: #d8dde4 }
</style>
</head>
