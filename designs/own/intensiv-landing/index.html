<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интенсив 7 ағын</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --card: #0a0a0a;
    --card2: #111;
    --line: rgba(255,255,255,.1);
    --text: #f2ece4;
    --muted: rgba(242,236,228,.62);
    --dim: rgba(242,236,228,.4);
    --accent: #ff7a00;
    --accent2: #ffa24d;
    --grad: linear-gradient(90deg, #ff7a00 0%, #ffa24d 100%);
    --ok: #22c55e;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  section { padding: 72px 0; }
  h2 { font-size: clamp(28px, 4.4vw, 44px); font-weight: 800; line-height: 1.1; letter-spacing: -.02em; margin-bottom: 28px; }
  .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--accent2); text-transform: uppercase; }
  .muted { color: var(--muted); }
  .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--grad); color: #1a1a1a; font-weight: 700; border-radius: 999px; padding: 16px 36px; font-size: 16px; border: 0; cursor: pointer; transition: transform .15s, box-shadow .15s; box-shadow: 0 8px 30px rgba(255,122,0,.3); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(255,122,0,.45); }
  .btn.sm { padding: 10px 22px; font-size: 14px; box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,.05); color: var(--accent2); border: 1px solid rgba(255,162,77,.35); box-shadow: none; }
  .btn.lg { padding: 20px 44px; font-size: 18px; }

  /* Бегущая строка */
  .ticker { background: var(--grad); color: #1a1a1a; overflow: hidden; white-space: nowrap; font-weight: 800; font-size: 13px; letter-spacing: .08em; padding: 10px 0; }
  .ticker .track { display: inline-block; animation: run 40s linear infinite; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* Шапка */
  header { position: sticky; top: 0; z-index: 50; background: rgba(0,0,0,.75); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
  .logo { font-weight: 900; font-size: 20px; letter-spacing: .04em; }
  .logo span { color: var(--accent); }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .lang { display: flex; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .lang button.on { background: var(--grad); color: #1a1a1a; }

  /* Hero */
  .hero { padding: 80px 0 72px; position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; width: 700px; height: 700px; right: -200px; top: -200px; background: radial-gradient(circle, rgba(255,122,0,.22), transparent 65%); pointer-events: none; }
  .hero-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center; position: relative; }
  .badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,162,77,.4); background: rgba(255,122,0,.08); color: var(--accent2); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700; letter-spacing: .08em; margin-bottom: 24px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .hero h1 { font-size: clamp(32px, 5.4vw, 58px); font-weight: 800; line-height: 1.05; letter-spacing: -.025em; margin-bottom: 24px; }
  .hero p { font-size: 19px; color: var(--muted); margin-bottom: 32px; max-width: 520px; }
  .ph { border: 1px dashed rgba(255,162,77,.35); border-radius: var(--radius); background: linear-gradient(135deg, rgba(255,122,0,.1), rgba(255,255,255,.02)); display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 14px; text-align: center; padding: 16px; }
  .hero .ph { aspect-ratio: 4/5; }

  /* Карточки «для вас, если» */
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; transition: border-color .2s, transform .2s; }
  .card:hover { border-color: rgba(255,162,77,.35); transform: translateY(-2px); }
  .num { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: .1em; margin-bottom: 14px; }
  .card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .card p { color: var(--muted); font-size: 15px; }
  .recognize { margin-top: 24px; background: linear-gradient(135deg, rgba(255,122,0,.16), rgba(255,122,0,.03)); border: 1px solid rgba(255,162,77,.3); border-radius: var(--radius); padding: 36px; display: flex; gap: 32px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .recognize h3 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .recognize p { color: var(--muted); max-width: 620px; }

  /* Сможете */
  .can { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .can div { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; font-weight: 600; }
  .check { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: #1a1a1a; display: grid; place-items: center; font-size: 14px; font-weight: 900; }

  /* Программа */
  .prog-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
  .prog-head h2 { margin-bottom: 0; }
  .prog-note { color: var(--muted); max-width: 640px; margin-bottom: 36px; }
  .week { border: 1px solid var(--line); border-radius: 24px; background: var(--card); margin-bottom: 16px; overflow: hidden; }
  .week-top { display: flex; gap: 20px; padding: 28px; cursor: pointer; align-items: flex-start; }
  .week-n { font-size: 44px; font-weight: 900; line-height: 1; min-width: 70px; }
  .week-meta { flex: 1; }
  .week-meta .eyebrow { margin-bottom: 6px; }
  .week-meta h3 { font-size: 22px; font-weight: 800; line-height: 1.25; margin-bottom: 6px; }
  .week-meta p { color: var(--muted); font-size: 15px; }
  .toggle { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent2); font-size: 20px; transition: transform .2s; }
  .week.open .toggle { transform: rotate(45deg); }
  .week-body { display: none; padding: 0 28px 28px; }
  .week.open .week-body { display: block; }
  .lesson { display: flex; gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); }
  .date { flex: none; width: 70px; text-align: center; }
  .date b { display: block; font-size: 30px; font-weight: 900; line-height: 1; }
  .date small { font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: .06em; }
  .lesson h4 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .lesson p { color: var(--muted); font-size: 14.5px; }
  .speaker { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--accent2); background: rgba(255,122,0,.1); border-radius: 999px; padding: 3px 10px; }
  .result { margin-top: 10px; border-radius: 16px; padding: 20px 22px; background: rgba(34,197,94,.07); border: 1px solid rgba(34,197,94,.3); }
  .result .eyebrow { color: var(--ok); margin-bottom: 6px; }
  .result p { color: var(--text); font-size: 15px; }
  .grand { margin-top: 16px; border-radius: 24px; padding: 36px; background: var(--grad); color: #1a1a1a; }
  .grand .eyebrow { color: #1a1a1a; opacity: .7; }
  .grand h3 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 900; margin: 6px 0 10px; }
  .grand p { font-weight: 500; max-width: 760px; }

  /* Мини-курсы */
  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .minis div { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--card); font-weight: 600; display: flex; gap: 12px; align-items: center; }
  .minis div::before { content: "▸"; color: var(--accent); }

  /* Скиллы */
  .skills { display: grid; grid-template-columns: 1fr 1.1fr; gap: 40px; align-items: center; }
  .term { background: #0a0a0a; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  .term-bar { display: flex; gap: 6px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .term-bar i { width: 11px; height: 11px; border-radius: 50%; background: #333; }
  .term-bar i:nth-child(1) { background: #ef4444; } .term-bar i:nth-child(2) { background: #eab308; } .term-bar i:nth-child(3) { background: #22c55e; margin-right: 8px; }
  .term-body { padding: 20px; line-height: 1.9; }
  .term-body .cmd { color: var(--accent2); }
  .term-body .ok { color: #4ade80; }
  .term-body .c { color: var(--dim); }
  .term-body .done { margin-top: 8px; color: var(--text); font-weight: 700; }

  /* Лёгкий вход */
  .easy { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .easy .ph { aspect-ratio: 4/3; }

  /* Истории */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--grad); color: #1a1a1a; border-color: transparent; }
  .story { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .story .tag { font-size: 12px; font-weight: 700; color: var(--accent2); margin-bottom: 10px; }
  .story h4 { font-size: 16px; margin-bottom: 6px; }
  .story p { color: var(--muted); font-size: 14px; }
  .note { color: var(--dim); font-size: 13px; margin-top: 18px; }

  /* Тарифы */
  .price-card { max-width: 560px; margin: 0 auto; text-align: center; border-radius: 28px; padding: 48px 32px; background: radial-gradient(circle at top, rgba(255,122,0,.25), transparent 60%), var(--card); border: 1px solid rgba(255,162,77,.4); }
  .price { font-size: clamp(48px, 8vw, 72px); font-weight: 900; letter-spacing: -.03em; margin: 12px 0 8px; }
  .price-card small { display: block; color: var(--dim); margin: 0 0 28px; font-size: 13px; }

  /* Требования */
  .req { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
  .req h4 { font-size: 17px; margin-bottom: 8px; }
  .budget { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .budget .card h3 { font-size: 15px; letter-spacing: .08em; color: var(--accent2); }
  .budget .sum { font-size: 30px; font-weight: 900; margin: 10px 0 14px; }
  .budget ul { list-style: none; display: grid; gap: 10px; }
  .budget li { color: var(--muted); font-size: 14.5px; padding-left: 16px; position: relative; }
  .budget li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }

  /* Срочность + менеджер */
  .urgent { text-align: center; font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; max-width: 820px; margin: 0 auto; line-height: 1.4; }
  .contact { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 40px; }
  .manager { display: flex; gap: 16px; align-items: center; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; flex: none; background: var(--grad); display: grid; place-items: center; color: #1a1a1a; font-weight: 900; font-size: 22px; }
  .contact-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* Вау */
  .wow { counter-reset: w; }
  .wow .card { display: flex; gap: 18px; align-items: center; }
  .wow .num { font-size: 32px; margin: 0; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; }
  .wow .card p { color: var(--text); font-weight: 600; font-size: 16px; }

  /* Состав */
  .people { overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
  .people .track { display: inline-flex; gap: 10px; animation: run 50s linear infinite; padding: 6px 0; }
  .people .track.rev { animation-direction: reverse; }
  .people span { border: 1px solid var(--line); border-radius: 999px; padding: 12px 22px; font-weight: 600; background: var(--card); }

  .final { text-align: center; }
  .final p { color: var(--muted); max-width: 720px; margin: 0 auto 32px; font-size: 17px; }

  footer { border-top: 1px solid var(--line); padding: 36px 0 48px; color: var(--dim); font-size: 13px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a:hover { color: var(--text); }

  @media (max-width: 900px) {
    .hero-grid, .skills, .easy, .contact, .req { grid-template-columns: 1fr; }
    .grid3, .can, .minis, .budget { grid-template-columns: 1fr 1fr; }
    .hero .ph { aspect-ratio: 16/10; }
  }
  @media (max-width: 600px) {
    section { padding: 52px 0; }
    .grid3, .can, .minis, .budget { grid-template-columns: 1fr; }
    .hero { padding: 48px 0; }
    .hdr-cta { display: none; }
    .week-top { padding: 20px; gap: 14px; }
    .week-n { font-size: 32px; min-width: 44px; }
    .week-body { padding: 0 20px 20px; }
    .date { width: 52px; } .date b { font-size: 24px; }
    .easy, .contact, .recognize { padding: 26px; }
    .grand { padding: 26px; }
    .btn.lg { padding: 18px 30px; font-size: 16px; }
  }
</style>
</head>

      <div class="track rev">${[...t.people.slice(7), ...t.people.slice(7)].map(p => `<span>${p}</span>`).join('')}</div>
    </div>
  </section>

  <section class="final"><div class="wrap">
    <h2>${t.finalTitle}</h2>
    <p>${t.finalText}</p>
    ${cta('lg')}
  </div></section>

  <footer><div class="wrap">
    <div>${t.company}</div>
    <div><a href="${LINKS.offer}">${t.offer}</a> | <a href="${LINKS.privacy}">${t.privacy}</a></div>
    <div>${t.rights}</div>
  </div></footer>`;
}

document.addEventListener('click', e => {
  const l = e.target.closest('[data-lang]');
  if (l) { lang = l.dataset.lang; try { localStorage.setItem('lang', lang); } catch (_) {} render(); return; }
  const n = e.target.closest('[data-niche]');
  if (n) { niche = +n.dataset.niche; render(); return; }
  const w = e.target.closest('.week-top');
  if (w) {
    const i = +w.parentElement.dataset.week;
    openWeeks.has(i) ? openWeeks.delete(i) : openWeeks.add(i);
    w.parentElement.classList.toggle('open');
  }
});

render();
</script>
</body>
</html>
